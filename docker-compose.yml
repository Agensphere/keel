# Local self-host: Postgres + MinIO (blob store, used once blobs land) + keel worker.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 2s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: keel
      MINIO_ROOT_PASSWORD: keelkeelkeel
    ports: ["9000:9000", "9001:9001"]
volumes:
  pgdata:
